name: CI

on:
  push:
    branches: [main, "branch/**", "feat/**", "fix/**"]
  pull_request:

jobs:
  quality:
    name: typecheck + lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # pnpm memblokir postinstall @prisma/client, jadi client di-generate eksplisit.
      - name: Prisma client
        run: pnpm prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit test
        run: pnpm test
